<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 60 660 460">
  <defs>
    <linearGradient id="swordGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
  </defs>
  <g transform="translate(-30, 20)">
    
    <!-- Dust behind back foot -->
    <circle cx="120" cy="460" r="15" fill="#CFD8DC"/>
    <circle cx="85" cy="465" r="10" fill="#CFD8DC"/>
    <circle cx="150" cy="455" r="22" fill="#B0BEC5" opacity="0.6"/>
    <circle cx="60" cy="470" r="8" fill="#90A4AE" opacity="0.5"/>

    <!-- Cape Layer 2 (Darker, Back) -->
    <path d="M 210,180 Q 80,200 40,310 Q 140,360 210,300 Q 170,250 210,190 Z" fill="#880E4F"/>
    
    <!-- Cape Layer 1 (Lighter, Main) -->
    <path d="M 220,170 Q 100,150 20,280 Q 120,320 200,280 Q 150,220 220,190 Z" fill="#D32F2F"/>
    <path d="M 220,170 Q 120,170 50,260 Q 110,290 170,260 Q 150,210 220,190 Z" fill="#F44336"/> <!-- Cape Highlight -->

    <!-- Left Arm & Shield (Background) -->
    <!-- Shield Base -->
    <circle cx="190" cy="220" r="45" fill="#263238" stroke="#FFCA28" stroke-width="6"/>
    <!-- Shield Pattern -->
    <polygon points="190,180 220,220 190,260 160,220" fill="#455A64"/>
    <circle cx="190" cy="220" r="15" fill="#00E5FF"/>
    
    <!-- Back Leg (Left Leg) -->
    <path d="M 230,300 L 160,370 L 120,470 L 170,470 L 190,380 L 250,310 Z" fill="#37474F"/>
    <!-- Back Leg Armor Highlights -->
    <path d="M 230,300 L 160,370 L 190,380 L 250,310 Z" fill="#455A64"/>
    <!-- Left Knee Pad -->
    <circle cx="170" cy="375" r="18" fill="#FFCA28"/>
    <circle cx="170" cy="375" r="8" fill="#E65100"/>
    <!-- Left Foot -->
    <polygon points="120,470 170,470 160,450 130,450" fill="#263238"/>

    <!-- Torso / Body Armor -->
    <path d="M 210,170 L 290,180 L 270,310 L 220,310 Z" fill="#546E7A"/>
    <!-- Torso Shading & Panels -->
    <path d="M 250,175 L 290,180 L 270,310 L 245,310 Z" fill="#78909C"/>
    <path d="M 210,170 L 290,180 L 285,195 L 213,185 Z" fill="#FFCA28"/> <!-- Collar trim -->
    
    <!-- Chest Core Glowing Emblem -->
    <polygon points="250,220 270,240 250,260 230,240" fill="#00E5FF"/>
    <polygon points="250,225 262,240 250,255 238,240" fill="#E0F7FA"/>

    <!-- Belt & Waist Guards -->
    <rect x="215" y="295" width="60" height="15" fill="#3E2723" transform="rotate(5 245 302)"/>
    <rect x="235" y="290" width="20" height="25" rx="3" fill="#FFCA28" transform="rotate(5 245 302)"/>
    <!-- Tassets (Skirt Armor) -->
    <polygon points="220,310 245,310 235,360 210,350" fill="#455A64"/>
    <polygon points="245,310 275,310 270,365 240,360" fill="#607D8B"/>
    <polygon points="245,310 260,310 255,362 240,360" fill="#90A4AE"/>

    <!-- Front Leg (Right Leg) -->
    <path d="M 250,300 L 330,360 L 370,470 L 430,470 L 390,380 L 290,310 Z" fill="#607D8B"/>
    <!-- Front Leg Highlights -->
    <path d="M 250,300 L 330,360 L 390,380 L 290,310 Z" fill="#90A4AE"/>
    <!-- Right Knee Pad -->
    <circle cx="340" cy="365" r="22" fill="#FFCA28"/>
    <circle cx="340" cy="365" r="10" fill="#E65100"/>
    <polygon points="340,340 365,365 340,390" fill="#FFF8E1" opacity="0.4"/> <!-- Shine -->
    <!-- Right Foot -->
    <polygon points="370,470 430,470 415,445 380,445" fill="#37474F"/>
    <polygon points="400,470 430,470 415,445 405,445" fill="#546E7A"/>

    <!-- Dust around front foot -->
    <circle cx="370" cy="465" r="12" fill="#CFD8DC"/>
    <circle cx="440" cy="460" r="15" fill="#CFD8DC"/>
    <circle cx="460" cy="465" r="10" fill="#B0BEC5"/>

    <!-- ============================================== -->
    <!-- Head & Helmet (Upgraded to Epic Mecha/Paladin Helm) -->
    <!-- ============================================== -->

    <!-- Heroic Glowing Halo -->
    <circle cx="260" cy="140" r="50" fill="#00E5FF" opacity="0.15"/>
    <circle cx="260" cy="140" r="30" fill="#00E5FF" opacity="0.25"/>

    <!-- Plume / Crest -->
    <path d="M 250,90 C 240,10 120,20 80,100 C 110,70 180,60 210,95 Z" fill="#B71C1C"/>
    <path d="M 250,90 C 220,30 140,40 100,100 C 130,75 180,70 210,95 Z" fill="#F44336"/>

    <!-- Neck Guard -->
    <path d="M 220,160 L 260,185 L 220,185 Z" fill="#37474F"/>
    
    <!-- Helmet Dome (Dark Metal) -->
    <path d="M 220,130 C 220,80 290,80 290,130 L 290,175 C 290,190 270,185 240,180 L 220,160 Z" fill="#546E7A"/>
    <!-- Dome Highlight -->
    <path d="M 255,90 C 280,90 290,110 290,130 L 290,175 C 290,185 270,183 255,180 Z" fill="#78909C"/>
    
    <!-- Front Face Plate (Silver/White for contrast) -->
    <path d="M 245,110 L 300,125 L 310,140 L 285,185 L 245,175 Z" fill="#CFD8DC"/>
    <path d="M 270,117 L 300,125 L 310,140 L 285,185 L 270,180 Z" fill="#FFFFFF"/>

    <!-- The Glowing Visor (A sleek, aggressive slit) -->
    <path d="M 260,135 L 305,140 L 290,150 L 260,145 Z" fill="#263238"/>
    <path d="M 262,137 L 300,141 L 288,148 L 262,143 Z" fill="#00E5FF"/>
    <polygon points="265,139 295,142 285,146 265,141" fill="#FFFFFF"/>

    <!-- Sharp Ear Fin / Wing -->
    <path d="M 255,140 L 200,100 L 235,170 Z" fill="#FFCA28"/>
    <path d="M 250,140 L 210,110 L 235,160 Z" fill="#FFE082"/>

    <!-- Decorative Crown/Forehead piece -->
    <polygon points="245,110 280,100 285,115 245,120" fill="#FFCA28"/>
    <polygon points="265,105 280,100 285,115 265,117" fill="#FFE082"/>

    <!-- ============================================== -->

    <!-- Right Arm (Attacking/Front) -->
    <!-- Upper Arm -->
    <path d="M 260,180 L 340,165 L 350,195 L 270,210 Z" fill="#78909C"/>
    <!-- Lower Arm -->
    <path d="M 340,165 L 420,175 L 415,205 L 340,195 Z" fill="#90A4AE"/>
    <!-- Elbow Pad -->
    <circle cx="345" cy="180" r="15" fill="#FFCA28"/>
    <!-- Hand / Gauntlet -->
    <circle cx="420" cy="190" r="18" fill="#455A64"/>
    <circle cx="420" cy="190" r="10" fill="#263238"/>

    <!-- Shoulder Pauldron (Right) -->
    <circle cx="270" cy="190" r="30" fill="#546E7A"/>
    <circle cx="270" cy="190" r="22" fill="#FFCA28"/>
    <circle cx="270" cy="190" r="14" fill="#E65100"/>
    <path d="M 270,160 L 280,190 L 260,190 Z" fill="#FFF8E1" opacity="0.6"/> <!-- Shine -->

    <!-- Weapon (Sword) -->
    <!-- Pommel -->
    <circle cx="385" cy="190" r="10" fill="#FFCA28"/>
    <!-- Grip -->
    <line x1="385" y1="190" x2="420" y2="190" stroke="#3E2723" stroke-width="12"/>
    <line x1="385" y1="190" x2="420" y2="190" stroke="#5D4037" stroke-width="6" stroke-dasharray="2, 2"/>
    <!-- Crossguard -->
    <path d="M 410,150 L 410,230 L 420,230 L 420,150 Z" fill="#FFCA28"/>
    <polygon points="410,150 415,140 420,150" fill="#FFCA28"/>
    <polygon points="410,230 415,240 420,230" fill="#FFCA28"/>
    <!-- Blade -->
    <polygon points="420,180 570,185 600,190 570,195 420,200" fill="url(#swordGradient)"/>
    <!-- Blade Core / Edge -->
    <polygon points="420,180 570,185 600,190 420,190" fill="#FFFFFF" opacity="0.7"/>
    <line x1="420" y1="190" x2="570" y2="190" stroke="#00E5FF" stroke-width="2" opacity="0.8"/>

    <!-- Foreground Action Effects (Sword Glow & Swoosh) -->
    <!-- Energy Thrust Cone -->
    <polygon points="600,190 500,140 520,190 500,240" fill="#00E5FF" opacity="0.3"/>
    <polygon points="615,190 540,165 550,190 540,215" fill="#E0F7FA" opacity="0.6"/>
    <!-- Curved Action Swoosh -->
    <path d="M 450,110 Q 620,190 450,270" fill="none" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="30, 15"/>
    <path d="M 470,130 Q 590,190 470,250" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Motion Sparks -->
    <circle cx="560" cy="160" r="3" fill="#00E5FF"/>
    <circle cx="580" cy="220" r="4" fill="#FFFFFF"/>
    <circle cx="500" cy="110" r="2" fill="#00E5FF"/>
    <circle cx="450" cy="280" r="3" fill="#E0F7FA"/>

  </g>
</svg>
