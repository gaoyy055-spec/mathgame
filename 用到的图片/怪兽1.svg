<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- 左犄角 -->
  <path d="M 170,160 Q 130,60 110,40 Q 150,90 190,120 Z" fill="#9E7659" stroke="#2B1A10" stroke-width="4" stroke-linejoin="round"/>
  <!-- 右犄角 -->
  <path d="M 330,160 Q 370,60 390,40 Q 350,90 310,120 Z" fill="#9E7659" stroke="#2B1A10" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- 犄角上的藤蔓 -->
  <path d="M 140,80 Q 110,100 135,120" fill="none" stroke="#7CB342" stroke-width="4" stroke-linecap="round"/>
  <path d="M 360,80 Q 390,100 365,120" fill="none" stroke="#7CB342" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 绿色的毛茸茸身体 (简化外轮廓) -->
  <path d="M 250,100 
           C 130,100 80,180 70,250 
           C 60,320 80,440 150,460 
           C 200,475 300,475 350,460 
           C 420,440 440,320 430,250 
           C 420,180 370,100 250,100 Z" 
        fill="#7CB342" stroke="#1B3F1D" stroke-width="6" stroke-linejoin="round"/>
        
  <!-- 身体毛发细节 (内部毛流感) -->
  <path d="M 110,230 Q 80,260 120,280" fill="none" stroke="#1B3F1D" stroke-width="4" stroke-linecap="round"/>
  <path d="M 390,230 Q 420,260 380,280" fill="none" stroke="#1B3F1D" stroke-width="4" stroke-linecap="round"/>
  <path d="M 120,350 Q 90,380 140,390" fill="none" stroke="#1B3F1D" stroke-width="4" stroke-linecap="round"/>
  <path d="M 380,350 Q 410,380 360,390" fill="none" stroke="#1B3F1D" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 脸部 (桃色) -->
  <path d="M 150,230 Q 250,180 350,230 C 390,330 330,400 250,410 C 170,400 110,330 150,230 Z" fill="#F4C28D" stroke="#2B1A10" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- 耳朵 -->
  <path d="M 145,250 Q 70,240 60,270 Q 90,290 125,290 Z" fill="#D98B7A" stroke="#2B1A10" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 355,250 Q 430,240 440,270 Q 410,290 375,290 Z" fill="#D98B7A" stroke="#2B1A10" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- 眼睛 (白色巩膜) -->
  <ellipse cx="200" cy="260" rx="38" ry="48" fill="white" stroke="#2B1A10" stroke-width="4"/>
  <ellipse cx="300" cy="260" rx="38" ry="48" fill="white" stroke="#2B1A10" stroke-width="4"/>
  
  <!-- 虹膜 (蓝色) -->
  <circle cx="215" cy="260" r="24" fill="#03A9F4" stroke="#2B1A10" stroke-width="3"/>
  <circle cx="285" cy="260" r="24" fill="#03A9F4" stroke="#2B1A10" stroke-width="3"/>
  
  <!-- 瞳孔 (黑色) -->
  <circle cx="220" cy="260" r="16" fill="#212121"/>
  <circle cx="280" cy="260" r="16" fill="#212121"/>
  
  <!-- 高光 -->
  <circle cx="226" cy="252" r="6" fill="white"/>
  <circle cx="274" cy="252" r="6" fill="white"/>
  <circle cx="215" cy="268" r="2" fill="white"/>
  <circle cx="285" cy="268" r="2" fill="white"/>

  <!-- 浓密的绿色眉毛 -->
  <path d="M 150,210 Q 190,175 235,215" fill="none" stroke="#558B2F" stroke-width="14" stroke-linecap="round"/>
  <path d="M 350,210 Q 310,175 265,215" fill="none" stroke="#558B2F" stroke-width="14" stroke-linecap="round"/>

  <!-- 鼻子 -->
  <ellipse cx="250" cy="315" rx="16" ry="9" fill="#5D4037" stroke="#2B1A10" stroke-width="2"/>
  
  <!-- 嘴巴 -->
  <path d="M 205,335 Q 250,365 295,335" fill="none" stroke="#2B1A10" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 牙齿 (小尖牙) -->
  <path d="M 230,345 L 238,368 L 246,349 Z" fill="white" stroke="#2B1A10" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 270,345 L 262,368 L 254,349 Z" fill="white" stroke="#2B1A10" stroke-width="3" stroke-linejoin="round"/>

  <!-- 左侧的粉色花朵 -->
  <g transform="translate(60, 200)">
    <circle cx="0" cy="-12" r="10" fill="#F48FB1" stroke="#2B1A10" stroke-width="2"/>
    <circle cx="-12" cy="0" r="10" fill="#F48FB1" stroke="#2B1A10" stroke-width="2"/>
    <circle cx="0" cy="12" r="10" fill="#F48FB1" stroke="#2B1A10" stroke-width="2"/>
    <circle cx="12" cy="0" r="10" fill="#F48FB1" stroke="#2B1A10" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#FFC107" stroke="#2B1A10" stroke-width="2"/>
  </g>
  
  <g transform="translate(85, 270) scale(0.8)">
    <circle cx="0" cy="-12" r="10" fill="#CE93D8" stroke="#2B1A10" stroke-width="2"/>
    <circle cx="-12" cy="0" r="10" fill="#CE93D8" stroke="#2B1A10" stroke-width="2"/>
    <circle cx="0" cy="12" r="10" fill="#CE93D8" stroke="#2B1A10" stroke-width="2"/>
    <circle cx="12" cy="0" r="10" fill="#CE93D8" stroke="#2B1A10" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#FFC107" stroke="#2B1A10" stroke-width="2"/>
  </g>

  <!-- 手中发光的小树苗 -->
  <!-- 发光效果 -->
  <circle cx="250" cy="425" r="30" fill="#FFF59D" opacity="0.6"/>
  
  <!-- 树苗叶子 -->
  <path d="M 248,435 C 248,400 220,390 220,390 C 235,385 250,400 248,420 Z" fill="#8BC34A" stroke="#1B3F1D" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 252,435 C 252,400 280,390 280,390 C 265,385 250,400 252,420 Z" fill="#8BC34A" stroke="#1B3F1D" stroke-width="2" stroke-linejoin="round"/>
  <!-- 树苗根部 -->
  <path d="M 240,450 Q 250,420 260,450 Z" fill="#8D6E63" stroke="#2B1A10" stroke-width="2"/>

  <!-- 抱树苗的小手 (覆盖在上面) -->
  <ellipse cx="210" cy="450" rx="30" ry="18" fill="#7CB342" stroke="#1B3F1D" stroke-width="4"/>
  <ellipse cx="290" cy="450" rx="30" ry="18" fill="#7CB342" stroke="#1B3F1D" stroke-width="4"/>
</svg>
